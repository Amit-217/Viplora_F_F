    <!-- Primary SEO, GEO & AEO Meta Tags -->
    <title>Viplora Foundation | Empowering Communities & Social Impact</title>
    <meta name="title" content="Viplora Foundation | Empowering Communities & Social Impact">
    <meta name="description" content="Viplora Foundation is a leading NGO dedicated to education, food security, rural farmer support, and environmental sustainability." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://viplora.org/">

      "logo": "https://viplora.org/logo.png",

        "@type": "Organization",
        "name": "Viplora Tech",
        "url": "https://viplora.pages.dev/"
      },
      "areaServed": "India",
      "knowsAbout": ["Education", "Food Security", "Environmental Sustainability", "Digital Academy"]
    }
